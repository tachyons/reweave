# frozen_string_literal: true

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake spec

      - name: Run linter
        run: bundle exec rake rubocop

  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Trusted publishing. The OIDC token is exchanged for a short-lived key that
      # names the owning RubyGems account, which is required for a first push.
      - name: Exchange OIDC token for a RubyGems API key
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          key=$(curl -fsS -X POST \
            https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H 'content-type: application/json' \
            -d "{\"jwt\":\"$jwt\",\"owner\":\"96754\"}" | jq -r .rubygems_api_key)
          mkdir -p "$HOME/.gem"
          printf -- "---\n:rubygems_api_key: %s\n" "$key" > "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"

      - name: Build and publish gem
        run: |
          gem build reweave.gemspec
          gem push reweave-*.gem
